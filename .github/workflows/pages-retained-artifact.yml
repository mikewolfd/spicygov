name: Retained T01 Pages artifact
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: upload_only
        options: [upload_only, deploy_forward, restore_prior]
        description: Separate reviewed upload and exact artifact deployment
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  upload:
    if: ${{ inputs.operation == 'upload_only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/pages-retained-artifact.py
            .github/pages-retained-binding.json
      - name: Verify transferred containers and complete member maps
        env:
          ARTIFACT_WORK: ${{ runner.temp }}/t01-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 4194304
          mkdir "$ARTIFACT_WORK"
          python3 -I -B scripts/pages-retained-artifact.py fetch --binding .github/pages-retained-binding.json --role prior --output "$ARTIFACT_WORK/prior"
          python3 -I -B scripts/pages-retained-artifact.py fetch --binding .github/pages-retained-binding.json --role forward --output "$ARTIFACT_WORK/forward"
      - name: Upload prior Pages tar
        id: prior
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages-prior
          path: ${{ runner.temp }}/t01-pages-${{ github.run_id }}-${{ github.run_attempt }}/prior/artifact.tar
          if-no-files-found: error
          overwrite: false
          retention-days: 14
          compression-level: 6
      - name: Upload forward Pages tar
        id: forward
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages-forward
          path: ${{ runner.temp }}/t01-pages-${{ github.run_id }}-${{ github.run_attempt }}/forward/artifact.tar
          if-no-files-found: error
          overwrite: false
          retention-days: 14
          compression-level: 6
      - name: Retain actual upload identities for root review
        env:
          PRIOR_ID: ${{ steps.prior.outputs.artifact-id }}
          PRIOR_DIGEST: ${{ steps.prior.outputs.artifact-digest }}
          FORWARD_ID: ${{ steps.forward.outputs.artifact-id }}
          FORWARD_DIGEST: ${{ steps.forward.outputs.artifact-digest }}
        run: |
          python3 -I -B - <<'PY'
          import json,os
          keys=('GITHUB_RUN_ID','GITHUB_SHA','PRIOR_ID','PRIOR_DIGEST','FORWARD_ID','FORWARD_DIGEST')
          print(json.dumps({k:os.environ[k] for k in keys},sort_keys=True))
          PY
  deploy:
    if: ${{ inputs.operation == 'deploy_forward' || inputs.operation == 'restore_prior' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/pages-retained-artifact.py
            .github/pages-retained-binding.json
      - name: Fetch and verify the exact immutable role content
        env:
          ROLE: ${{ inputs.operation == 'restore_prior' && 'prior' || 'forward' }}
        run: |
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 4194304
          python3 -I -B scripts/pages-retained-artifact.py fetch --binding .github/pages-retained-binding.json --role "$ROLE" --require-deployment-role --output "$RUNNER_TEMP/pages-input"
      - name: Package verified content with standard GNU Pages tar
        run: |
          mkdir "$RUNNER_TEMP/pages-site" "$RUNNER_TEMP/pages-standard"
          tar --extract --file "$RUNNER_TEMP/pages-input/artifact.tar" --directory "$RUNNER_TEMP/pages-site" --no-same-owner --no-same-permissions --delay-directory-restore
          tar --format=gnu --dereference --hard-dereference --directory "$RUNNER_TEMP/pages-site" --create --file "$RUNNER_TEMP/pages-standard/artifact.tar" .
      - name: Upload the verified Pages tar in this run
        id: same_run_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages-${{ inputs.operation == 'restore_prior' && 'prior' || 'forward' }}
          path: ${{ runner.temp }}/pages-standard/artifact.tar
          if-no-files-found: error
          overwrite: false
          retention-days: 14
          compression-level: 6
      - name: Download the exact new upload for complete member verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.same_run_upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/pages-downloaded
          merge-multiple: true
      - name: Verify the downloaded tar and current writer before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE: ${{ inputs.operation == 'restore_prior' && 'prior' || 'forward' }}
          ARTIFACT_ID: ${{ steps.same_run_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.same_run_upload.outputs.artifact-digest }}
        run: |
          python3 -I -B scripts/pages-retained-artifact.py preflight --binding .github/pages-retained-binding.json --role "$ROLE" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" --artifact-directory "$RUNNER_TEMP/pages-downloaded" --map "$RUNNER_TEMP/pages-input/members.json" --output "$RUNNER_TEMP/pages-admission.json"
      - name: Deploy the verified artifact from this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-${{ inputs.operation == 'restore_prior' && 'prior' || 'forward' }}
          timeout: 600000
      - name: Retain admission and maintained action outcome
        if: ${{ always() }}
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 -I -B - <<'PYOUT'
          import json,os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'pages-outcome.json').write_text(json.dumps({'action_outcome':os.environ['DEPLOYMENT_OUTCOME'],'page_url':os.environ['PAGE_URL'],'run':os.environ['GITHUB_RUN_ID'],'head':os.environ['GITHUB_SHA'],'reported_pages_identifier_source':'maintained action log; corroborate exact Pages endpoint; response ID fallback may be ambiguous'})+'\n')
          PYOUT
      - name: Retain deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pages-admission.json
            ${{ runner.temp }}/pages-outcome.json
          if-no-files-found: warn
          retention-days: 14
