name: Deploy SpicyGov
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner for build and deployment
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
      source_catalog:
        description: Opt in to the exact reviewed catalog build (requires separate authority)
        type: boolean
        default: false
      build_only:
        description: Catalog proposal supports build only; deployment needs reviewed artifact selection
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 90
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Refuse an unqualified catalog deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_catalog && !inputs.build_only }}
        run: |
          echo 'Catalog deployment requires separately reviewed exact artifact selection.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check offline release boundaries
        run: |
          python -B tests/test_catalog_resume.py
          python -B tests/test_coverage_release.py
          python -B tests/test_release_workflows.py
      - uses: ./.github/actions/catalog-producer
      - name: Check bounded source catalog transport
        run: python -B tests/test_source_catalog_archive.py
      - name: Stage the exact reviewed source catalog
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_catalog && inputs.build_only }}
        timeout-minutes: 10
        run: |
          python -I -B scripts/fetch-source-catalog.py \
            --work-dir "${{ runner.temp }}/source-catalog-46443510" \
            --output "${{ github.workspace }}/public/source-catalog"
      - run: npm test
      - name: Build UI with explicit coverage status
        run: npm run build:ui -- --coverage "${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && 'completed' || 'unavailable' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Automatic and catalog opt-in builds retain artifacts for separate review.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && !inputs.source_catalog }}
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
