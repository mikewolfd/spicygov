name: Deploy SpicyGov
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner for build and deployment
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 90
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      SPICYGOV_NATIVE_COVERAGE_BRIDGE: ${{ github.workspace }}/.coverage-backend/scripts/restore_coverage_processing.py
      SPICYGOV_NATIVE_COVERAGE_PYTHON: ${{ github.workspace }}/.coverage-backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - name: Check out the qualified native receipt reader
        uses: actions/checkout@v4
        with:
          repository: mikewolfd/spicy-regs
          ref: d8573ca1dc4e5a602992c7a158edf06f0399f079
          path: .coverage-backend
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: .coverage-backend/uv.lock
      - name: Install the locked native receipt reader
        working-directory: .coverage-backend
        run: uv sync --frozen --no-default-groups --group source-readers
      - name: Check the pinned legislative and Congress readers
        run: |
          "$SPICYGOV_NATIVE_COVERAGE_PYTHON" "$SPICYGOV_NATIVE_COVERAGE_BRIDGE" --schema bill_versions > /dev/null
          "$SPICYGOV_NATIVE_COVERAGE_PYTHON" "$SPICYGOV_NATIVE_COVERAGE_BRIDGE" --schema congress_bills > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb==1.4.4 pyarrow==21.0.0 fsspec==2026.9.0 aiohttp==3.11.14
      - run: python tests/test_time_coverage.py
      - run: python tests/test_collection_coverage.py
      - run: python tests/test_publication_census.py
      - run: python tests/test_coverage_dimensions.py
      - run: python tests/test_coverage_gate.py
      - run: python tests/test_regulation_coverage_maps.py
      - run: python tests/test_native_receipt_coverage.py
      - run: python tests/test_fec_coverage_maps.py
      - run: python tests/test_congress_coverage_maps.py
      - run: python tests/test_native_legislative_coverage.py
      - name: Restore validated coverage checkpoints
        id: coverage-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/coverage-maps
          key: ${{ runner.os }}-coverage-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-coverage-v1-
      - name: Verify coverage for every published table
        id: coverage-scan
        # A restored checkpoint is only a candidate. The builder rechecks exact
        # source, schema, policy, scanner, paired exports and UTC month bindings.
        run: python scripts/build-coverage-maps.py
      - name: Save validated coverage checkpoints
        if: ${{ always() && steps.coverage-cache.outcome == 'success' && (steps.coverage-scan.outcome == 'success' || steps.coverage-scan.outcome == 'failure') && hashFiles('.cache/coverage-maps/*.json') != '' }}
        uses: actions/cache/save@v5
        with:
          # Preserve completed tables after a failed scan; the builder still
          # requires every current table before it replaces the served map.
          path: .cache/coverage-maps
          key: ${{ steps.coverage-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
