# Diagnostic branch only: this registered workflow has no build/deploy/cache job.
name: Profile retained coverage restore samples
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restore-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the unchanged failing reader
        uses: actions/checkout@v4
        with:
          repository: mikewolfd/spicy-regs
          ref: 032c5a2ef9da7754a74be911254ccffc8dddfe53
          path: .coverage-navigation-backend
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false
      - name: Install locked maintained reader
        timeout-minutes: 8
        working-directory: .coverage-navigation-backend
        run: uv sync --frozen --no-default-groups --group source-readers
      - name: Record hosted resources and source identity
        run: |
          mkdir -p diagnostic-results
          uname -a > diagnostic-results/uname.txt
          lscpu > diagnostic-results/cpu.txt
          free -b > diagnostic-results/memory-before.txt
          df -B1 > diagnostic-results/disk-before.txt
          git rev-parse HEAD > diagnostic-results/website-revision.txt
          git -C .coverage-navigation-backend rev-parse HEAD > diagnostic-results/source-revision.txt
      - name: Check instrumented admission and refusal controls
        timeout-minutes: 1
        run: .coverage-navigation-backend/.venv/bin/python experiments/hosted-restore-profile-20261006/test_profile_restore.py > diagnostic-results/refusal-controls.log 2>&1
      - name: Profile exact retained sample selections
        timeout-minutes: 10
        run: .coverage-navigation-backend/.venv/bin/python experiments/hosted-restore-profile-20261006/profile_restore.py --out diagnostic-results/runs
      - name: Record final resources
        if: always()
        run: |
          mkdir -p diagnostic-results
          free -b > diagnostic-results/memory-after.txt
          df -B1 > diagnostic-results/disk-after.txt
      - name: Retain raw diagnostics, samples and preregistration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-restore-profile-${{ github.run_id }}
          path: |
            diagnostic-results
            experiments/hosted-restore-profile-20261006
          retention-days: 14
