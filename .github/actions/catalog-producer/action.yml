name: Set up catalog producer tests
description: Use the same pinned Python producer for verification and deployment tests.
inputs:
  producer-revision:
    description: Exact available backend commit; advance only after the reviewed producer is published.
    default: d2cf198b575d582a4a8e6c809c76ed191c43ede2
runs:
  using: composite
  steps:
    - name: Require an exact producer revision
      shell: bash
      env:
        PRODUCER_REVISION: ${{ inputs.producer-revision }}
      run: python -c "import os,re; assert re.fullmatch(r'[0-9a-f]{40}',os.environ['PRODUCER_REVISION']), 'An exact available producer commit is required'"
    - name: Check out maintained catalog producer
      uses: actions/checkout@v4
      with:
        repository: mikewolfd/spicy-regs
        ref: ${{ inputs.producer-revision }}
        path: .ci/spicy-regs
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          src/spicy_regs
          vendor/*.whl
          pyproject.toml
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install catalog export dependencies
      shell: bash
      run: |
        python - <<'PY'
        from pathlib import Path
        import subprocess, sys, tomllib
        root = Path('.ci/spicy-regs').resolve()
        sources = tomllib.loads((root/'pyproject.toml').read_text())['tool']['uv']['sources']
        wheels = [(root/sources[name]['path']).resolve() for name in ('rulespec-artifacts','spicy-docs')]
        assert all(path.is_relative_to(root/'vendor') and path.is_file() for path in wheels)
        subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check',
            'httpx==0.28.1', 'loguru==0.7.3', 'pyarrow==23.0.0', 'jsonschema==4.26.0',
            'duckdb==1.5.5', *map(str,wheels)])
        PY
    - name: Configure producer integration tests
      shell: bash
      run: |
        printf '%s\n' \
          'SOURCE_CATALOG_PYTHON=python3' \
          "SOURCE_CATALOG_PYTHONPATH=$GITHUB_WORKSPACE/.ci/spicy-regs/src" >> "$GITHUB_ENV"
